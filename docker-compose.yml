services:
  minecraft:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.20.4"
      MODE: creative
      LEVEL_TYPE: FLAT
      ONLINE_MODE: "FALSE"
      OPS: BuilderBot
      DIFFICULTY: peaceful
      SPAWN_PROTECTION: "0"
      ALLOW_FLIGHT: "TRUE"
      MEMORY: 2G
      PATCH_DEFINITIONS: /patches
      # OPS résout via l'API Mojang (UUID premium ≠ UUID offline) → op via RCON à chaque boot
      RCON_CMDS_STARTUP: |-
        op BuilderBot
    ports:
      - "25565:25565"
    volumes:
      - ./mc-data:/data
      - ./mc-config:/patches:ro
